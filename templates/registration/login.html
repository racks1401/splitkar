{% extends "base.html" %}

{% block title %}Login - SplitKar{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <div class="card shadow-sm mt-4">
      <div class="card-body p-4">
        <h3 class="card-title text-center mb-4">Login</h3>

        {% if form.errors %}
          <div class="alert alert-danger py-2 small">
            Please enter a correct username and password.
          </div>
        {% endif %}

        <form method="post" action="{% url 'login' %}">
          {% csrf_token %}
          <div class="mb-3">
            <label for="id_username" class="form-label">Username</label>
            <input type="text" name="username" autofocus required id="id_username" class="form-control" value="{{ form.username.value|default:'' }}">
          </div>
          <div class="mb-3">
            <label for="id_password" class="form-label">Password</label>
            <input type="password" name="password" required id="id_password" class="form-control">
          </div>
          <button type="submit" class="btn btn-primary w-100">Log In</button>
        </form>

        <div class="text-center mt-3">
          <span class="text-muted small">Don't have an account?</span>
          <a href="{% url 'signup' %}" class="small">Sign up</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
